server:
  port: ${SERVER_PORT}
spring:
  application:
    name: "${APPLICATION_NAME}"
  webflux:
    base-path: "/${APPLICATION_NAME}"
  devtools:
    add-properties: false
    restart:
      enabled: false
  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_URL}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    pool:
      initial-size: 10
      max-size: 20
      max-idle-time: 30m
    properties:
      schema: ${POSTGRES_SCHEMA}
management:
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}"
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
security:
  jwt:
    secret: ${JWT_SECRET}
  session-cookie:
    name: ${SESSION_COOKIE_NAME:__Host-repu_session}
auth:
  session:
    base-url: ${AUTH_SESSION_BASE_URL}
    service-token: ${AUTH_SERVICE_TOKEN}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
logging:
  level:
    org.springframework.security: ${LOGIN_LEVEL_SPRING_SECURITY}
    org.springframework.web.reactive.function.server: ${LOGIN_LEVEL_SPRING_REACTIVE}
    org.springframework.r2dbc: ${LOGIN_LEVEL_SPRING_R2DBC}
    io.r2dbc.postgresql: ${LOGIN_LEVEL_R2DBC_POSTGRESQL}
    io.r2dbc.postgresql.QUERY: ${LOGIN_LEVEL_R2DBC_POSTGRESQL_QUERY}
    io.r2dbc.postgresql.PARAM: ${LOGIN_LEVEL_R2DBC_POSTGRESQL_PARAM}
