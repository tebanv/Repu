server:
  port: 8080
spring:
  application:
    name: "ms-companies"
  webflux:
    base-path: "/ms-companies"
  devtools:
    add-properties: false
    restart:
      enabled: false
  profiles:
    active: "local"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: 89.117.73.146
    port: 5434
    database: lucy
    schema: lucy
    username: lucy
    password: lucyadmin

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.reactive.function.server: INFO
