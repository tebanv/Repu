server:
  port: 8081
spring:
  application:
    name: "ms-auth"
  webflux:
    base-path: "/ms-auth"
  devtools:
    add-properties: false
    restart:
      enabled: false
  profiles:
    active: "local"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:*"

adapters:
  r2dbc:
    host: localhost
    port: 5435
    database: repu
    schema: repu
    username: admin
    password: "adm1n123@"
security:
  jwt:
    # Esta es una llave de ejemplo en Base64 (32 bytes / 256 bits).
    secret: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
    expiration-minutes: 60
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web.reactive.function.server: INFO


