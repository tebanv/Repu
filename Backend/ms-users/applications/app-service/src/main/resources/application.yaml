server:
  port: ${SERVER_PORT}
spring:
  application:
    name: "${APPLICATION_NAME}"
  webflux:
    base-path: "/${APPLICATION_NAME}"
  devtools:
    add-properties: false
    restart:
      enabled: false
  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}
management:
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}"
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

adapters:
  r2dbc:
    host: ${POSTGRES_URL}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    schema: ${POSTGRES_SCHEMA}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
logging:
  level:
    org.springframework.security: ${LOGIN_LEVEL_SPRING_SECURITY}
    org.springframework.web.reactive.function.server: ${LOGIN_LEVEL_SPRING_REACTIVE}
    org.springframework.r2dbc: ${LOGIN_LEVEL_SPRING_R2DBC}
    io.r2dbc.postgresql: ${LOGIN_LEVEL_R2DBC_POSTGRESQL}
    io.r2dbc.postgresql.QUERY: ${LOGIN_LEVEL_R2DBC_POSTGRESQL_QUERY}
    io.r2dbc.postgresql.PARAM: ${LOGIN_LEVEL_R2DBC_POSTGRESQL_PARAM}
    co.com.repu: ${LOGIN_LEVEL_APP}
    org.springframework.mail: ${LOGIN_LEVEL_SPRING_MAIL}

app:
  password-recovery:
    from: ${MAIL_FROM}