spring:
  application:
    name: "${APPLICATION_NAME}"

  webflux:
    base-path: "/${APPLICATION_NAME}"

  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_URL}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  sql:
    init:
      mode: "never"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"

adapters:
  r2dbc:
    host: ${POSTGRES_URL}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    schema: ${POSTGRES_SCHEMA}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  wompi:
    base-url: ${WOMPI_BASE_URL}
    public-key: ${WOMPI_PUBLIC_KEY}
    private-key: ${WOMPI_PRIVATE_KEY}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET}
    event-secret: ${WOMPI_EVENT_SECRET}

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}"
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
  health:
    circuitbreakers:
      enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}