server:
  port: 8088
spring:
  application:
    name: "ms-orders"
  webflux:
    base-path: "/ms-orders"
  devtools:
    add-properties: false
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8088"
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:repu}
    schema: ${DB_SCHEMA:repu}
    username: ${DB_USERNAME:repu}
    password: ${DB_PASSWORD:repuadmin}
orders:
  reservation-ttl: ${ORDER_RESERVATION_TTL:PT15M}
auth:
  session:
    base-url: ${AUTH_SESSION_BASE_URL:http://localhost:8081/ms-auth}
    connect-timeout: ${AUTH_SESSION_CONNECT_TIMEOUT:PT2S}
    response-timeout: ${AUTH_SESSION_RESPONSE_TIMEOUT:PT3S}
    service-token: ${AUTH_SERVICE_TOKEN:7ed8607cb2f27eafda3f674e4b1495a06b3271ae7d17869a9814ca59d5c72561}
