server:
  port: ${SERVER_PORT}
spring:
  application:
    name: "${APPLICATION_NAME}"
  webflux:
    base-path: "/${APPLICATION_NAME}"
  devtools:
    add-properties: false
  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"
management:
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}"
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
adapters:
  r2dbc:
    host: ${POSTGRES_URL}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    schema: ${POSTGRES_SCHEMA}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
orders:
  reservation-ttl: ${ORDER_RESERVATION_TTL}
auth:
  session:
    base-url: ${AUTH_SESSION_BASE_URL}
    connect-timeout: ${AUTH_SESSION_CONNECT_TIMEOUT}
    response-timeout: ${AUTH_SESSION_RESPONSE_TIMEOUT}
    service-token: ${AUTH_SERVICE_TOKEN}
