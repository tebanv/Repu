x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # FRONTEND (Repu User App)
  # ==========================================
  front-user:
    build:
      context: ./front-user
      dockerfile: Dockerfile
    container_name: repu_front_user
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Enrutamiento inicial basado en IP pública sin requerir dominio obligatorio
      - "traefik.http.routers.repu-front.rule=Host(`${PUBLIC_HOST:-167.86.88.151}`)"
      - "traefik.http.routers.repu-front.entrypoints=web"
      - "traefik.http.services.repu-front.loadbalancer.server.port=3000"
      - "traefik.docker.network=repu_proxy"

  # ==========================================
  # BACKEND: MICROSERVICIOS SPRING BOOT (7)
  # ==========================================

  ms-auth:
    build:
      context: ./Backend/ms-auth
      dockerfile: Dockerfile
    container_name: repu_ms_auth
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M
    environment:
      - APPLICATION_NAME=${APPLICATION_NAME_MS_AUTH}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE_MS_AUTH}
      - SERVER_PORT=${SERVER_PORT_MS_AUTH}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_URL}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - POSTGRES_URL=${POSTGRES_URL}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA}
      - AUTH_SERVICE_TOKEN=${AUTH_SERVICE_TOKEN}
      - LOGIN_LEVEL_SPRING_SECURITY=${LOGIN_LEVEL_SPRING_SECURITY}
      - LOGIN_LEVEL_SPRING_REACTIVE=${LOGIN_LEVEL_SPRING_REACTIVE}
      - LOGIN_LEVEL_SPRING_R2DBC=${LOGIN_LEVEL_SPRING_R2DBC}
      - LOGIN_LEVEL_R2DBC_POSTGRESQL=${LOGIN_LEVEL_R2DBC_POSTGRESQL}
      - LOGIN_LEVEL_R2DBC_POSTGRESQL_QUERY=${LOGIN_LEVEL_R2DBC_POSTGRESQL_QUERY}
      - LOGIN_LEVEL_R2DBC_POSTGRESQL_PARAM=${LOGIN_LEVEL_R2DBC_POSTGRESQL_PARAM}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS_MS_AUTH}
    networks:
      - internal-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.repu-ms-auth.rule=Host(`${PUBLIC_HOST:-167.86.88.151}`) && PathPrefix(`/ms-auth`)"
      - "traefik.http.routers.repu-ms-auth.entrypoints=web"
      - "traefik.http.services.repu-ms-auth.loadbalancer.server.port=8081"
      - "traefik.docker.network=repu_proxy"

  ms-categories:
    build:
      context: ./Backend/ms-categories
      dockerfile: Dockerfile
    container_name: repu_ms_categories
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://repu_postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - internal-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.repu-ms-categories.rule=Host(`${PUBLIC_HOST:-167.86.88.151}`) && PathPrefix(`/ms-categories`)"
      - "traefik.http.routers.repu-ms-categories.entrypoints=web"
      - "traefik.http.services.repu-ms-categories.loadbalancer.server.port=8082"
      - "traefik.docker.network=repu_proxy"

  ms-companies:
    build:
      context: ./Backend/ms-companies
      dockerfile: Dockerfile
    container_name: repu_ms_companies
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 256M
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:postgresql://repu_postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
