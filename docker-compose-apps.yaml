          memory: 256M
    environment:
      - APPLICATION_NAME=${APPLICATION_NAME_MS_AUTH}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE_MS_AUTH}
      - SERVER_PORT=${SERVER_PORT_MS_AUTH}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_URL}:${POSTGRES_PORT}/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - POSTGRES_URL=${POSTGRES_URL}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA}
      - AUTH_SERVICE_TOKEN=${AUTH_SERVICE_TOKEN}
      - LOGIN_LEVEL_SPRING_SECURITY=${LOGIN_LEVEL_SPRING_SECURITY}
      - LOGIN_LEVEL_SPRING_REACTIVE=${LOGIN_LEVEL_SPRING_REACTIVE}
      - LOGIN_LEVEL_SPRING_R2DBC=${LOGIN_LEVEL_SPRING_R2DBC}
      - LOGIN_LEVEL_R2DBC_POSTGRESQL=${LOGIN_LEVEL_R2DBC_POSTGRESQL}
      - LOGIN_LEVEL_R2DBC_POSTGRESQL_QUERY=${LOGIN_LEVEL_R2DBC_POSTGRESQL_QUERY}
      - LOGIN_LEVEL_R2DBC_POSTGRESQL_PARAM=${LOGIN_LEVEL_R2DBC_POSTGRESQL_PARAM}
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS_MS_AUTH}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-__Host-repu_session}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - SESSION_COOKIE_ALLOW_INSECURE_HTTP=${SESSION_COOKIE_ALLOW_INSECURE_HTTP:-false}
