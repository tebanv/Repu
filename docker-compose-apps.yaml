x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # FRONTEND (Repu User App)
  # ==========================================
  front-user:
    build:
      context: ./front-user
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: repu_front_user
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      # Enrutamiento inicial basado en IP pública sin requerir dominio obligatorio
      - "traefik.http.routers.repu-front.rule=Host(`${PUBLIC_HOST:-167.86.88.151}`)"
      - "traefik.http.routers.repu-front.entrypoints=web"
      - "traefik.http.services.repu-front.loadbalancer.server.port=3000"
      - "traefik.docker.network=repu_proxy"

  # ==========================================
  # BACKEND: MICROSERVICIOS SPRING BOOT (7)
  # ==========================================

